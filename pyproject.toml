[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formlang-lean-bridge"
version = "0.2.0"
description = "Export Pyformlang finite automata to Lean 4 and optionally verify goals with PyPantograph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyformlang>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/formlang_lean_bridge"]
